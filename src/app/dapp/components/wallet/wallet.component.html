<div class="wallet-container">
  <button class="btn-primary" (click)="connect()">Iniciar sesión con MetaMask</button>

  <div *ngIf="wallet$ | async as wallet" class="wallet-info">

    <label for="network">Cambiar red:</label>
    <select id="network" [(ngModel)]="selectedNetwork" (change)="changeNetwork()">
      <option *ngFor="let net of networks" [value]="net.chainId">{{ net.name }}</option>
    </select>

    <label>Dirección:</label>
    <input [value]="wallet.address" disabled />

    <label>Saldo:</label>
    <input [value]="wallet.balance + ' ETH'" disabled />

    <label>Red actual:</label>
    <input [value]="wallet.networkName" disabled />

  </div>
</div>

<hr />

<div class="wallet-container">
  <h2>Enviar ETH (sin contrato)</h2>

  <label>Dirección de destino:</label>
  <input [(ngModel)]="recipient" placeholder="0x..." />

  <label>Monto (ETH):</label>
  <input [(ngModel)]="amount" placeholder="0.01" />

  <hr />

  <button class="btn-primary" (click)="send()">Enviar</button>

  <div *ngIf="txHash" class="success">
    Transacción enviada:<br />
    <a target="_blank" [href]="'https://holesky.etherscan.io/tx/' + txHash">{{ txHash }}</a>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>
</div>
